db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 1000000

    info {
        name = "strfry test"
        description = "Test relay for system tests"
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55

    writePolicy {
        plugin = ""
    }

    compression {
        enabled = false
    }

    numThreads {
        ingester = 3
        reqWorker = 3
        reqMonitor = 3
        negentropy = 2
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
